<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FairFreeze</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#14213d;--muted:#5b6575;--line:#e2e6ec;--brand:#0b5fff;--brand-ink:#fff;
--ok:#0a7a4f;--ok-bg:#e6f6ef;--warn:#9a5b00;--warn-bg:#fff4e0;--bad:#b42318;--bad-bg:#fdecea;--soft:#eef3ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,'Segoe UI','Nirmala UI','Leelawadee UI','Microsoft YaHei',system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--brand);color:var(--brand-ink);font-weight:600}
button.ghost{background:var(--soft);color:var(--brand)}button:disabled{opacity:.55;cursor:not-allowed}
button:hover:not(:disabled),.btn:hover{filter:brightness(1.08)}button.ghost:hover:not(:disabled),.btn.ghost:hover{filter:none;background:#e0e9ff}
.btn{display:inline-block;text-decoration:none;font-weight:600;border-radius:8px;padding:9px 14px;background:var(--brand);color:var(--brand-ink)}.btn.ghost{background:var(--soft);color:var(--brand)}
.pick{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}.pick .fn{font-size:13px;color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick label,.drop{position:relative;cursor:pointer}.pick label{display:inline-flex;align-items:center;gap:6px;font-weight:600;border-radius:8px;padding:8px 13px;background:#fff;color:var(--brand);border:1px dashed #9dbcff}
.pick label:hover{background:var(--soft)}.pick input,.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.pick label:focus-within,.drop:focus-within{outline:3px solid #8db4ff;outline-offset:2px}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed #b9cdf8;background:var(--soft);border-radius:12px;padding:18px 14px;text-align:center;color:#173a8a;font-weight:600}
.drop.over{border-color:var(--brand);background:#e0e9ff}.drop .fn{font-weight:400;font-size:13px;color:var(--muted);word-break:break-word}.drop .hint{font-weight:400;font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.mm .scroll svg{min-width:640px}
dialog{border:1px solid var(--line);border-radius:12px;padding:18px 20px;max-width:380px;width:calc(100% - 32px);color:var(--ink);box-shadow:0 20px 50px rgba(20,33,61,.25)}
dialog::backdrop{background:rgba(20,33,61,.45)}dialog h3{margin:0 0 6px;font-size:17px}dialog .row{justify-content:flex-end;margin-top:14px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #8db4ff;outline-offset:2px}
header{background:var(--ink);color:#fff;padding:12px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;letter-spacing:.2px}.logo span{color:#7fb0ff}.tag{color:#c7d2e6;font-size:13px}
.ctx{background:#14214a;color:#c7d2e6;font-size:13px;padding:7px 22px;display:flex;gap:10px;flex-wrap:wrap}.ctx b{color:#fff}.ctx .sep{opacity:.4}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}.kpis div{background:var(--bg);border-radius:8px;padding:6px 8px}.kpis b{display:block;font-size:18px}.kpis span{font-size:11px;color:var(--muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.badges span{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--soft);color:#173a8a}.badges .b-bad{background:var(--bad-bg);color:var(--bad)}.badges .b-ok{background:var(--ok-bg);color:var(--ok)}
.mm{margin-top:14px}.mm h4{margin:0 0 4px}
.guide{background:linear-gradient(135deg,#eef3ff,#e6f6ef);border-color:#cfe0ff}.guide ol{margin:6px 0 0;padding-left:20px}.guide li{margin:4px 0}.guide .row button{padding:4px 10px;font-size:13px}
nav{margin-left:auto;display:flex;gap:6px}nav button{background:transparent;color:#c7d2e6}nav button.on{background:#24365e;color:#fff}
main{display:grid;grid-template-columns:300px 1fr;gap:18px;padding:18px 22px;max-width:1400px;margin:0 auto}main>*{min-width:0}
@media(max-width:900px){main{grid-template-columns:1fr;padding:12px 16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.inbox h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;color:var(--muted);letter-spacing:.6px}
.item{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin-bottom:8px;padding:10px 12px;font-weight:400}
.item.on{border-color:var(--brand);box-shadow:0 0 0 2px #cfe0ff}.item b{display:block}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.cc{font-size:11px;font-weight:700;background:var(--soft);color:var(--brand);border-radius:5px;padding:1px 6px}
.pill{font-size:12px;border-radius:99px;padding:2px 9px;background:#eef0f4;color:var(--muted);white-space:nowrap}
.clock{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}.clock.urgent{color:var(--bad);font-weight:600}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 10px;display:flex;gap:10px;align-items:center}
.n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px}
.muted{color:var(--muted)}.small{font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}.stat .v{font-size:22px;font-weight:700}.stat .l{font-size:12px;color:var(--muted)}
.stat.ok{background:var(--ok-bg)}.stat.ok .v{color:var(--ok)}.stat.bad{background:var(--bad-bg)}.stat.bad .v{color:var(--bad)}
.checks{list-style:none;padding:0;margin:8px 0}.checks li{display:flex;gap:9px;padding:6px 0;border-bottom:1px solid var(--line)}
.checks .i{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}
.i.y{background:var(--ok-bg);color:var(--ok)}.i.x{background:var(--bad-bg);color:var(--bad)}.i.w{background:var(--warn-bg);color:var(--warn)}
.banner{border-radius:10px;padding:12px 14px;margin:10px 0}.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.ok{background:var(--ok-bg);color:var(--ok)}.banner.info{background:var(--soft);color:#173a8a}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600;font-size:12px}
.badge{font-weight:700;border-radius:8px;padding:3px 10px;font-size:13px}.strong{background:var(--ok-bg);color:var(--ok)}.moderate{background:var(--soft);color:#173a8a}
.weak{background:var(--warn-bg);color:var(--warn)}.red_flag{background:var(--bad-bg);color:var(--bad)}.victim{background:#f2ecff;color:#5b2bb5}
.steps{list-style:none;padding:0;margin:8px 0;display:flex;flex-wrap:wrap;gap:6px}.steps li{background:var(--soft);color:#173a8a;border-radius:6px;padding:3px 8px;font-size:12px;font-family:Consolas,monospace;animation:pop .3s both}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}
.doc{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px 14px;font-size:14px;max-height:340px;overflow:auto}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{padding:5px 10px;font-size:13px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs a img{height:110px;border:1px solid var(--line);border-radius:8px}
.md h3,.md h4{margin:10px 0 4px;font-size:15px}.md p{margin:6px 0}.md ul{margin:4px 0;padding-left:20px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #cfe0ff;border-top-color:var(--brand);border-radius:50%;animation:r 1s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes r{to{transform:rotate(360deg)}}
.hidden{display:none}.err{color:var(--bad)}svg text{font-family:inherit}
.cust{max-width:520px;margin:0 auto;padding:16px}.cust .big{font-size:28px;font-weight:700}
input[type=text]{font:inherit;color:var(--ink);padding:8px 10px;border:1px solid #cfd6e0;border-radius:8px;background:#fff}input[type=text]:focus{border-color:var(--brand)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
@media(max-width:600px){header{padding:12px 16px}nav{margin-left:0;width:100%}nav button{flex:1;padding:8px 4px;font-size:13px;white-space:nowrap}.ctx{flex-direction:column;gap:2px;padding:8px 16px}.ctx .sep{display:none}.casehead{flex-direction:column;align-items:flex-start}.casehead>div:last-child{text-align:left!important}.actions>button,.actions>.btn{flex:1 1 100%;text-align:center}.pick{width:100%}.pick .fn{max-width:none;flex:1}}
</style>
</head>
<body>
<header>
  <img src="/logo.svg" alt="" width="38" height="38"><div><div class="logo">Fair<span>Freeze</span></div><div class="tag">Hold the right money. Free the innocent. Return it to victims.</div></div>
  <nav id="nav"><button data-v="console" class="on">Officer console</button><button data-v="regulator">Regulator view</button><button data-v="reset" title="Put all demo cases back to New">Reset demo</button></nav>
</header>
<div class="ctx" id="ctx"><span><b>Freeze desk</b> · Financial Crime Compliance</span><span class="sep">|</span><span>Duty officer: <b>Ayesha Khan</b>, FinCrime Compliance Officer</span><span class="sep">|</span><span>Demo workspace: 3 partner banks in India, Thailand and Singapore</span></div>
<div id="app"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = (n, cur) => `${cur} ${Number(n).toLocaleString("en-US", {maximumFractionDigits: 2})}`;
const LABEL = {strong:"Strong evidence", moderate:"Moderate evidence", weak:"Weak evidence", red_flag:"Red flag: likely mule", victim:"Scam victim"};
const ACTION = {release_rest_keep_disputed:"Hold only the disputed amount, release the rest now", hold_disputed_request_more:"Hold only the disputed amount, ask for one more document",
  keep_full_hold_escalate:"Keep full hold, escalate to police, no customer notice", restrict_with_essentials:"Keep the order, keep living money open, block the scammers"};
const CLIP = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>`;
const ACCEPT = "image/png,image/jpeg,application/pdf";
const errBox = m => `<div class="banner bad">${esc(m)}</div>`;
// a file picker in the console's own style; the native input stays inside it for keyboard and screen readers
const picker = (id, label, none) => `<span class="pick"><label>${CLIP}${esc(label)}<input type="file" id="${id}" accept="${ACCEPT}" aria-label="${esc(label)}"></label><span class="fn" id="${id}-fn">${esc(none)}</span></span>`;
function wirePicker(id, none) {
  const i = $("#" + id), fn = $(`#${id}-fn`), zone = i.closest(".drop");
  const show = () => { fn.textContent = [...i.files].map(f => f.name).join(", ") || none; };
  i.onchange = show;
  if (zone) {
    zone.ondragover = e => { e.preventDefault(); zone.classList.add("over"); };
    zone.ondragleave = () => zone.classList.remove("over");
    zone.ondrop = e => { e.preventDefault(); zone.classList.remove("over"); i.files = e.dataTransfer.files; show(); };
  }
}
function confirmDialog(title, text, ok) {
  return new Promise(res => {
    const d = document.createElement("dialog");
    d.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3><p class="small muted" style="margin:0">${esc(text)}</p><div class="row"><button class="ghost" value="no">Cancel</button><button value="yes">${esc(ok)}</button></div></form>`;
    document.body.append(d); d.onclose = () => { res(d.returnValue === "yes"); d.remove(); }; d.showModal();
  });
}
async function api(path, opts) {
  const r = await fetch(path, opts); const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || `Request failed (${r.status})`); return j;
}
function md(t) {
  return esc(t).split(/\n/).map(l => l.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"))
    .map(l => /^#{1,4} /.test(l) ? `<h4>${l.replace(/^#+ /, "")}</h4>` : /^\s*[*-] /.test(l) ? `<li>${l.replace(/^\s*[*-] /, "")}</li>` : l.trim() ? `<p>${l}</p>` : "")
    .join("").replace(/(<li>.*?<\/li>)+/g, m => `<ul>${m}</ul>`);
}
function countdown(due) {
  const s = Math.floor((new Date(due) - new Date()) / 1000);
  if (s <= 0) return {t: "Deadline passed", urgent: true};
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return {t: (d ? `${d}d ` : "") + `${h}h ${String(m).padStart(2, "0")}m ${String(sec).padStart(2, "0")}s left`, urgent: s < 6 * 3600};
}
setInterval(() => document.querySelectorAll("[data-due]").forEach(el => { const c = countdown(el.dataset.due); el.textContent = c.t; el.classList.toggle("urgent", c.urgent); }), 1000);

/* ---------------- customer link ---------------- */
const T = {
  Hindi: {hi:n=>`नमस्ते ${n} जी`, safe:"आपका खाता चालू है। आप बाकी पैसे इस्तेमाल कर सकते हैं।", held:"जाँच के लिए रोकी गई राशि", free:"आप अभी इस्तेमाल कर सकते हैं",
    why:"पुलिस की शिकायत में एक भुगतान का ज़िक्र है। सिर्फ़ उतनी राशि रोकी गई है, पूरा खाता नहीं।", ask:"अपना पक्ष बताइए: बिक्री की चैट, बिल, कूरियर रसीद या फ़ोटो भेजें।",
    up:"फ़ाइलें भेजें", pick:"फ़ाइलें चुनें", none:"कोई फ़ाइल नहीं चुनी गई", hint:"PNG, JPG या PDF, 10 MB तक", sample:"डेमो फ़ाइलें इस्तेमाल करें", done:"धन्यवाद। आपके दस्तावेज़ मिल गए। बैंक अधिकारी जल्द समीक्षा करेंगे।", lang:"English"},
  Thai: {hi:n=>`สวัสดีค่ะ คุณ${n}`, safe:"บัญชีของคุณยังใช้งานได้ คุณใช้เงินส่วนที่เหลือได้ตามปกติ", held:"ยอดที่ระงับชั่วคราวเพื่อตรวจสอบ", free:"ยอดที่ใช้ได้ทันที",
    why:"มีรายการรับโอนหนึ่งรายการที่อยู่ในเรื่องร้องเรียน ธนาคารระงับเฉพาะยอดนั้น ไม่ใช่ทั้งบัญชี", ask:"ส่งหลักฐานการขาย: แชทกับลูกค้า ใบเสร็จ เลขพัสดุ หรือรูปสินค้า",
    up:"ส่งไฟล์", pick:"เลือกไฟล์", none:"ยังไม่ได้เลือกไฟล์", hint:"PNG, JPG หรือ PDF ไม่เกิน 10 MB", sample:"ใช้ไฟล์ตัวอย่าง (เดโม)", done:"ขอบคุณค่ะ ธนาคารได้รับเอกสารแล้ว เจ้าหน้าที่จะตรวจสอบโดยเร็ว โทร 1441 กด 2 เพื่อยืนยันตัวตน", lang:"English"},
  Mandarin: {hi:n=>`${n}女士，您好`, safe:"这是为了保护您的储蓄。日常生活费和账单照常可以使用。", allow:"每月可用生活费", keep:"照常支付",
    why:"警方认为有人正在骗您转账。这不是您的错，骗子非常狡猾。", ask:"如果方便，请把与对方的聊天记录发给我们，我们会帮您看清楚。",
    up:"发送文件", pick:"选择文件", none:"未选择文件", hint:"PNG、JPG 或 PDF，最大 10 MB", sample:"使用示例文件（演示）", done:"谢谢您。我们已收到，银行人员会尽快联系您。", lang:"English"},
  English: {hi:n=>`Hello ${n}`, safe:"Your account is still open. You can use the rest of your money.", held:"Held for review", free:"Free to use now",
    allow:"Monthly living money", keep:"Still paid as usual",
    why:"A police complaint mentions one payment. Only that amount is held, not your whole account.", ask:"Tell us your side: send the sale chat, bill, courier slip or photos.",
    up:"Send files", pick:"Choose files or drop them here", none:"No file chosen", hint:"PNG, JPG or PDF, up to 10 MB", sample:"Use demo files", done:"Thank you. We have your documents. A bank officer will review them soon.", lang:null}
};
async function customerPage(cid) {
  // the customer sees their bank, not the officer's desk details
  ["#nav", "#ctx", ".tag"].forEach(s => $(s).classList.add("hidden"));
  const tok = encodeURIComponent(new URLSearchParams(location.search).get("t") || "");
  const p = await api(`/api/public/${cid}?t=${tok}`); let lang = p.language;
  const draw = () => {
    const t = {...T.English, ...T[lang]}, en = T.English;
    const sgWhy = lang === "English" && p.kind === "restriction" ? "Police believe someone is trying to scam you. This is not your fault; scammers are very skilled." : t.why;
    const sgAsk = lang === "English" && p.kind === "restriction" ? "If you can, send us the chat with that person and we will help you see it clearly." : t.ask;
    $("#app").innerHTML = `<div class="cust"><div class="card">
      <div class="row"><b>${esc(p.bank)}</b>${lang !== "English" ? `<button class="ghost" id="lg">${t.lang}</button>` : `<button class="ghost" id="lg">${esc(p.language)}</button>`}</div>
      <h1 style="margin-top:10px">${esc(t.hi(p.first_name))}</h1><p>${t.safe}</p>
      ${p.kind === "inbound" ? `<div class="grid"><div class="stat ok"><div class="v">${money(p.free, p.currency)}</div><div class="l">${t.free}</div></div>
        <div class="stat"><div class="v">${money(p.held, p.currency)}</div><div class="l">${t.held}</div></div></div>`
      : `<div class="grid"><div class="stat ok"><div class="v">${money(p.allowance, p.currency)}</div><div class="l">${t.allow || en.allow}</div></div></div>
        <p class="small">${t.keep || en.keep}: ${p.keep_paying.map(esc).join(", ")}</p>`}
      <p>${p.kind === "restriction" ? sgWhy : t.why}</p><p class="small muted">${esc(p.deadline_label)}</p></div>
      <div class="card"><p><b>${p.kind === "restriction" ? sgAsk : t.ask}</b></p>
      <label class="drop">${CLIP}<span>${t.pick}</span><span class="fn" id="f-fn">${t.none}</span><span class="hint">${t.hint}</span>
        <input type="file" id="f" multiple accept="${ACCEPT}" aria-label="${esc(t.pick)}"></label>
      <div class="actions" style="margin-top:12px"><button id="send">${t.up}</button><button class="ghost" id="demo">${t.sample}</button></div>
      <p id="msg" aria-live="polite">${p.submitted ? t.done : ""}</p></div></div>`;
    wirePicker("f", t.none);
    $("#lg").onclick = () => { lang = lang === "English" ? p.language : "English"; draw(); };
    const go = async useSample => {
      const fd = new FormData(); const files = $("#f").files;
      if (!useSample && !files.length) { $("#msg").textContent = t.ask; return; }
      if (!useSample) [...files].forEach(f => fd.append("files", f));
      $("#msg").innerHTML = `<span class="spin"></span>`; $("#send").disabled = $("#demo").disabled = true;
      try { await api(`/api/cases/${cid}/evidence?source=customer&t=${tok}`, {method: "POST", body: useSample ? undefined : fd}); $("#msg").textContent = t.done; }
      catch (e) { $("#msg").innerHTML = errBox(e.message); }
      $("#send").disabled = $("#demo").disabled = false;
    };
    $("#send").onclick = () => go(false); $("#demo").onclick = () => go(true);
  };
  draw();
}

/* ---------------- officer console ---------------- */
let current = null, cases = [];
async function consolePage() {
  cases = await api("/api/cases");
  let seen = false; try { seen = localStorage.getItem("ff-guide") === "hidden"; } catch (e) {}
  const guide = seen ? "" : `<div class="card guide" id="guide"><div class="row"><b>New here? Try it in 2 minutes</b><button class="ghost" id="hideGuide">Hide</button></div>
    <ol class="small"><li><b>Ravi</b> (India): press 1, then 3 "Use the sample evidence", then 4 "Run the Case Agent" (about 45 seconds), then approve.</li>
    <li><b>Vikram</b>: already processed. See why his perfect-looking documents are a red flag, and why no letter goes to him.</li>
    <li><b>Nok</b> (Thai) and <b>Mrs Tan</b> (Singapore, Mandarin): other countries, same engine.</li>
